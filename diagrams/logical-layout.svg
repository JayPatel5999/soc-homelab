<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-family="Arial, Helvetica, sans-serif" role="img">
<title>SOC homelab logical layout and detection data flow</title>
<desc>Kali and a vulnerable Linux target in the attack zone send traffic through OPNsense to the lab core. Wazuh agents on the domain controller and Windows client, plus syslog from OPNsense, feed the Wazuh server. Alerts are triaged and written up on GitHub.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="820" height="500" fill="#FFFFFF"/>
<text x="40" y="34" font-size="18" font-weight="bold" fill="#2C2C2A">Logical layout and detection data flow</text>

<rect x="30" y="70" width="240" height="230" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="50" y="94" font-size="14" font-weight="bold" fill="#712B13">VLAN 40 Attack zone</text>
<text x="50" y="112" font-size="12" fill="#993C1D">10.10.40.0/24</text>
<rect x="50" y="128" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#993C1D" stroke-width="1"/>
<text x="150" y="150" font-size="14" font-weight="bold" fill="#712B13" text-anchor="middle">Kali attacker</text>
<text x="150" y="168" font-size="12" fill="#993C1D" text-anchor="middle">10.10.40.10</text>
<rect x="50" y="204" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#993C1D" stroke-width="1"/>
<text x="150" y="226" font-size="14" font-weight="bold" fill="#712B13" text-anchor="middle">Linux target</text>
<text x="150" y="244" font-size="12" fill="#993C1D" text-anchor="middle">10.10.40.20, Wazuh agent</text>
<text x="50" y="286" font-size="12" fill="#993C1D">No route to home or internet</text>

<rect x="330" y="140" width="160" height="80" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="410" y="170" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle">OPNsense</text>
<text x="410" y="189" font-size="12" fill="#5F5E5A" text-anchor="middle">Firewall rules</text>
<text x="410" y="205" font-size="12" fill="#5F5E5A" text-anchor="middle">Suricata IDS</text>

<rect x="550" y="70" width="240" height="300" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="570" y="94" font-size="14" font-weight="bold" fill="#3C3489">VLAN 30 Lab core</text>
<text x="570" y="112" font-size="12" fill="#534AB7">10.10.30.0/24</text>
<rect x="570" y="128" width="190" height="56" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<text x="665" y="150" font-size="14" font-weight="bold" fill="#3C3489" text-anchor="middle">Domain controller</text>
<text x="665" y="168" font-size="12" fill="#534AB7" text-anchor="middle">10.10.30.10, Wazuh agent</text>
<rect x="570" y="198" width="190" height="56" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<text x="665" y="220" font-size="14" font-weight="bold" fill="#3C3489" text-anchor="middle">Windows client</text>
<text x="665" y="238" font-size="12" fill="#534AB7" text-anchor="middle">10.10.30.20, Wazuh agent</text>
<rect x="570" y="278" width="190" height="64" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="2"/>
<text x="665" y="302" font-size="14" font-weight="bold" fill="#3C3489" text-anchor="middle">Wazuh server</text>
<text x="665" y="320" font-size="12" fill="#534AB7" text-anchor="middle">10.10.30.5, dashboard</text>

<path d="M250 156 L290 156 L290 170 L328 170" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M250 232 L290 232 L290 192 L328 192" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M490 180 L520 180 L520 226 L568 226" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M490 168 L530 168 L530 156 L568 156" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M760 156 L778 156 L778 310 L762 310" fill="none" stroke="#6E6C65" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M760 226 L778 226" fill="none" stroke="#6E6C65" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M410 220 L410 330 L568 330" fill="none" stroke="#6E6C65" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>

<text x="50" y="330" font-size="12" fill="#444441">Solid arrow: attack traffic</text>
<text x="50" y="350" font-size="12" fill="#444441">Dashed arrow: logs to Wazuh</text>
<text x="330" y="352" font-size="12" fill="#444441">Syslog from firewall and Suricata</text>

<path d="M730 342 L730 410" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="550" y="412" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="670" y="434" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle">Alert triage</text>
<text x="670" y="452" font-size="12" fill="#5F5E5A" text-anchor="middle">MITRE ATT&amp;CK mapping</text>
<path d="M550 440 L492 440" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="330" y="412" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="410" y="434" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle">GitHub write-up</text>
<text x="410" y="452" font-size="12" fill="#5F5E5A" text-anchor="middle">Evidence and lessons</text>
</svg>
