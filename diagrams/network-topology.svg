<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" font-family="Arial, Helvetica, sans-serif" role="img">
<title>SOC homelab network topology</title>
<desc>A Raspberry Pi running Pi-hole, the home router, and a Wi-Fi extender sit upstream. The extender connects by Ethernet to a Proxmox host running an OPNsense firewall VM, which routes to three VLANs: Home, Lab core, and Attack zone.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="820" height="520" fill="#FFFFFF"/>
<text x="40" y="34" font-size="18" font-weight="bold" fill="#2C2C2A">SOC homelab: network topology</text>

<rect x="40" y="60" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="130" y="82" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle">Raspberry Pi</text>
<text x="130" y="101" font-size="12" fill="#5F5E5A" text-anchor="middle">Pi-hole DNS</text>

<rect x="320" y="60" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="410" y="82" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle">Home router</text>
<text x="410" y="101" font-size="12" fill="#5F5E5A" text-anchor="middle">Internet gateway</text>

<rect x="600" y="60" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="690" y="82" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle">Wi-Fi extender</text>
<text x="690" y="101" font-size="12" fill="#5F5E5A" text-anchor="middle">Ethernet to host</text>

<line x1="220" y1="88" x2="320" y2="88" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="500" y1="88" x2="600" y2="88" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="6 4"/>
<path d="M690 116 L690 150 L480 150 L480 183" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="30" y="135" width="760" height="355" rx="16" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="6 4"/>
<text x="50" y="161" font-size="14" font-weight="bold" fill="#2C2C2A">Proxmox host: Dell Precision 3420 SFF</text>

<rect x="300" y="185" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="410" y="207" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle">OPNsense VM</text>
<text x="410" y="226" font-size="12" fill="#5F5E5A" text-anchor="middle">Firewall, DHCP, DNS, Suricata</text>

<path d="M410 241 L410 298" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M410 270 L155 270 L155 298" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M410 270 L665 270 L665 298" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="40" y="300" width="230" height="150" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="155" y="326" font-size="14" font-weight="bold" fill="#085041" text-anchor="middle">VLAN 20 Home</text>
<text x="155" y="346" font-size="12" fill="#0F6E56" text-anchor="middle">10.10.20.0/24</text>
<text x="155" y="378" font-size="13" fill="#085041" text-anchor="middle">Jellyfin</text>
<text x="155" y="400" font-size="13" fill="#085041" text-anchor="middle">NAS share (Samba)</text>
<text x="155" y="422" font-size="13" fill="#085041" text-anchor="middle">Tailscale subnet router</text>

<rect x="295" y="300" width="230" height="150" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="410" y="326" font-size="14" font-weight="bold" fill="#3C3489" text-anchor="middle">VLAN 30 Lab core</text>
<text x="410" y="346" font-size="12" fill="#534AB7" text-anchor="middle">10.10.30.0/24</text>
<text x="410" y="378" font-size="13" fill="#3C3489" text-anchor="middle">Wazuh server</text>
<text x="410" y="400" font-size="13" fill="#3C3489" text-anchor="middle">Domain controller (AD)</text>
<text x="410" y="422" font-size="13" fill="#3C3489" text-anchor="middle">Windows client</text>

<rect x="550" y="300" width="230" height="150" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="665" y="326" font-size="14" font-weight="bold" fill="#712B13" text-anchor="middle">VLAN 40 Attack zone</text>
<text x="665" y="346" font-size="12" fill="#993C1D" text-anchor="middle">10.10.40.0/24</text>
<text x="665" y="378" font-size="13" fill="#712B13" text-anchor="middle">Kali attacker</text>
<text x="665" y="400" font-size="13" fill="#712B13" text-anchor="middle">Vulnerable targets</text>
<text x="665" y="422" font-size="13" fill="#712B13" text-anchor="middle">No route to home or internet</text>

<text x="50" y="476" font-size="12" fill="#5F5E5A">Dashed line: Wi-Fi link. Solid line: Ethernet. VLANs are virtual, inside Proxmox.</text>
</svg>
